# /etc/turnserver.conf: coturn TURN relay, used only by peers that have no direct path between
# them. Credentials come from the rendezvous server's /v1/ice-servers (shared secret, 24 h validity).
# Replace 203.0.113.10 with the server's public IP, rendezvous.example.com with its domain, and
# CHANGE_ME with the same secret as TURN_SECRET in /etc/rendezvous.env.
listening-port=3478
listening-ip=203.0.113.10
relay-ip=203.0.113.10
# If the public IP is not on an interface (cloud NAT), use instead:
# external-ip=PUBLIC_IP/PRIVATE_IP
min-port=49160
max-port=49999
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME
realm=rendezvous.example.com
no-tls
no-dtls
no-cli
no-multicast-peers
# Relay only to public addresses, never into this host or private networks. (The server's own
# public IP must stay allowed: when both peers relay, they talk relay to relay.)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
user-quota=12
total-quota=200
log-file=syslog
simple-log
