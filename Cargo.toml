[package]
name = "spec-rel"
version = "0.1.0"
edition = "2021"
description = "A special-relativity-aware 4D spacetime raytracer in Rust"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.27"
pollster = "1.0.1"
rayon = "1.10"
wgpu = "30.0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
